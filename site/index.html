<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wanderlust Mission: 153 SAC huts</title>
<meta name="description" content="A logbook of one hiker's mission to reach all 153 Swiss Alpine Club huts, mapped in 3D with routes, weather and trip notes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<div id="map" aria-label="3D map of Switzerland showing completed hut routes"></div>

<header class="bar">
  <a class="brand" href="#" id="brand" aria-label="Wanderlust Mission, back to the full map">
    <span class="blaze" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="brand-name">Wanderlust Mission</span>
  </a>
  <button type="button" class="bar-photos" id="nav-photos">Photos</button>
  <button type="button" class="bar-menu" id="nav-menu" aria-expanded="false" aria-controls="nav">Menu</button>
  <nav class="nav" id="nav" aria-label="Sections">
    <button type="button" id="nav-logbook" aria-pressed="true">Logbook</button>
    <button type="button" id="nav-mission">Mission</button>
    <button type="button" id="nav-rankings">Rankings</button>
    <button type="button" id="nav-about">About</button>
  </nav>
</header>

<aside class="rail" id="rail" aria-label="Logbook entries">
  <div class="rail-head">
    <h2>Logbook</h2>
    <p id="rail-count"></p>
  </div>
  <ol class="rail-list" id="rail-list"></ol>
</aside>

<div class="wx" id="wx" aria-hidden="true"><canvas id="wx-shade"></canvas><canvas id="wx-fall"></canvas></div>

<div class="clock" id="clock" hidden>
  <svg class="clock-arc" id="clock-arc" viewBox="0 0 120 46" width="120" height="46" aria-hidden="true"></svg>
  <p><b id="clock-time"></b><span id="clock-wx"></span></p>
</div>

<button type="button" class="replay-btn" id="replay">
  <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M6 4.5v11l9-5.5z" fill="currentColor"/></svg>Replay the mission
</button>

<button type="button" class="meter" id="meter" aria-label="Open mission progress">
  <span class="meter-num"><b id="meter-done">0</b><span>of <span id="meter-total">153</span> huts</span></span>
  <span class="meter-ticks" id="meter-ticks" aria-hidden="true"></span>
</button>

<div class="mapctl" role="group" aria-label="Map options">
  <div class="seg" id="basemap" role="radiogroup" aria-label="Map style">
    <button type="button" role="radio" aria-checked="false" data-base="summer">Topo</button>
    <button type="button" role="radio" aria-checked="false" data-base="winter">Winter</button>
    <button type="button" role="radio" aria-checked="true" data-base="aerial">Aerial</button>
  </div>
  <button type="button" class="ctl-btn" id="tilt" aria-pressed="true">3D</button>
  <button type="button" class="ctl-btn" id="light" aria-pressed="true" title="Light and weather of the day, inside a logbook">Light</button>
</div>

<div class="strip" id="strip" hidden>
  <p class="strip-head"><b>Elevation</b><span id="strip-now"></span></p>
  <div class="chart" id="strip-chart"></div>
</div>

<div class="card" id="card" hidden></div>

<figure class="flycard" id="flycard" hidden><img id="flycard-img" alt=""><figcaption id="flycard-cap"></figcaption></figure>
<div class="hud" id="hud" hidden>
  <p class="hud-text"><b id="hud-title"></b><span id="hud-sub"></span></p>
  <div class="hud-bar" id="hud-bar" hidden><i id="hud-fill"></i></div>
  <div class="hud-btns" id="hud-btns"></div>
</div>

<section class="panel" id="panel" aria-live="polite" hidden>
  <button type="button" class="panel-close" id="panel-close" aria-label="Close">
    <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div class="panel-scroll" id="panel-body" tabindex="-1"></div>
</section>

<section class="gallery" id="gallery" aria-label="Photos" hidden>
  <div class="gallery-in" id="gallery-in" tabindex="-1"></div>
</section>

<section class="gallery page" id="page" hidden>
  <div class="gallery-in" id="page-in" tabindex="-1"></div>
</section>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo" hidden>
  <button type="button" class="lb-btn lb-close" id="lb-close" aria-label="Close photo"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <button type="button" class="lb-btn lb-prev" id="lb-prev" aria-label="Previous photo"><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"><path d="M12.5 4L6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button type="button" class="lb-btn lb-next" id="lb-next" aria-label="Next photo"><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"><path d="M7.5 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <img id="lb-img" alt="">
  <div class="lb-bar"><p id="lb-cap"></p><a class="btn" id="lb-dl" download>Download full size</a></div>
</div>

<div class="tip" id="tip" hidden></div>
<p class="mapfail" id="mapfail" hidden>The 3D map needs WebGL, which this browser has switched off. The logbook list still works.</p>

<script src="vendor/maplibre-gl.js"></script>
<script src="js/data.js"></script>
<script src="js/stories.js"></script>
<script src="js/photos.js"></script>
<script src="js/huts.js"></script>
<script src="js/peaks.js"></script>
<script src="js/rankings.js"></script>
<script src="js/sky.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
