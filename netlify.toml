# Netlify publishes the site/ folder as it is. There is no build step.
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/photos/original/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
